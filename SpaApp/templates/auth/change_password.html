{% extends 'layout/base.html'%}
{% block title%}Đổi mật khẩu{%endblock%}
{%block content%}
<div class="container col-md-5 col-lg-4">

    <h3 class="text-success text-center mt-4 mb-4">
        ĐỔI MẬT KHẨU
    </h3>

    {% if err_msg %}
    <div class="alert alert-danger">
        {{ err_msg }}
    </div>
    {%elif suc_msg%}
    <div class="alert alert-success">
        {{ suc_msg }}
    </div>
    {% endif %}

    <form method="POST">
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="old_password" name="old_password" placeholder="Nhập mật khẩu cũ"  required>
            <label for="old_password">Mật khẩu cũ</label>
        </div>

        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="new_password" name="new_password" placeholder="Nhập mật khẩu mới"  required>
            <label for="new_password">Mật khẩu mới</label>
        </div>
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Nhập xác nhân mật khẩu"  required>
            <label for="confirm_password">Xác nhận mật khẩu</label>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-success">Đổi mật khẩu</button>
        </div>
    </form>
</div>
{%endblock%}
