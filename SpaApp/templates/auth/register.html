{% extends 'layout/base.html' %}

{% block title %}Đăng ký tài khoản{% endblock %}
{% block content %}
<div class="container col-md-6 col-lg-5">
    <h3 class="text-success text-center mt-4 mb-4">ĐĂNG KÝ TÀI KHOẢN</h3>
    {% if err_msg %}
    <div class="alert alert-danger">
        {{ err_msg }}
    </div>
    {%endif%}
    {%if succ %}
    <div class="alert alert-success">
        {{ succ }}
    </div>
    {% endif %}

    <form method="POST">

        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="fullname" name="fullname" placeholder="Nhập họ tên" value="{{fullname}}" required>
            <label for="fullname">Họ và tên</label>
        </div>

        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="phone" name="phone" placeholder="Nhập số điện thoại" value="{{phone}}" required>
            <label for="phone">Số điện thoại</label>
        </div>

        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="username" name="username" placeholder="Nhập tài khoản" value="{{username}}" required>
            <label for="username">Tên đăng nhập</label>
        </div>

        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu" value="{{password}}" required>
            <label for="password">Mật khẩu</label>
        </div>

        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Xác nhận mật khẩu" value="{{confirm_password}}" required>
            <label for="confirm_password">Xác nhận mật khẩu</label>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-success">Đăng ký</button>
        </div>

    </form>

    <p class="text-center mt-3">
        Đã có tài khoản?
        <a href="/login" class="text-success text-decoration-none">Đăng nhập</a>
    </p>
</div>
{% endblock %}
